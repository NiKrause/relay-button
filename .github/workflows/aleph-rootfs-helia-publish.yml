name: Aleph Rootfs IPFS Publish

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Rootfs profile to build and publish
        required: true
        default: orbitdb-relay
        type: choice
        options:
          - orbitdb-relay
          - uc-go-peer
          - ucan-store
      publish:
        description: Optionally publish the rootfs image through Aleph IPFS and Aleph STORE. The rootfs artifact is always uploaded.
        required: true
        default: false
        type: boolean
      deploy_vm:
        description: Deploy a VM after publishing the rootfs
        required: true
        default: false
        type: boolean
      confidential:
        description: Deploy as an AMD SEV-SNP confidential instance (needs the CONFIDENTIAL_LUKS_PASSPHRASE secret)
        required: false
        default: false
        type: boolean
      confidential_rootfs_item_hash:
        description: Reuse an encrypted rootfs an earlier confidential run built for this version
        required: false
        default: ""
        type: string
      vm_ssh_public_key:
        description: SSH public key for the deployed VM (else the VM_SSH_PUBLIC_KEY secret); baked into a confidential image
        required: false
        default: ""
        type: string
      vm_vcpus:
        description: vCPUs of the deployed VM
        required: false
        default: "1"
        type: string
      vm_memory_mib:
        description: Memory of the deployed VM in MiB (a confidential VM needs more; see the reusable workflow reference)
        required: false
        default: "1024"
        type: string
      enable_caddy_proxy:
        description: Configure the guest with proxy-backed Caddy HTTPS/WSS
        required: false
        default: true
        type: boolean
      rootfs_contract_path:
        description: Path to the rootfs contract in this repository
        required: true
        default: aleph/contract.json
        type: string
      project_repository:
        description: Repository that contains the project being packaged
        required: true
        default: NiKrause/orbitdb-relay
        type: string
      project_ref:
        description: Ref of the project repository to package
        required: true
        default: main
        type: string
      rootfs_skip_build:
        description: Reuse an existing rootfs artifact from the workspace
        required: true
        default: false
        type: boolean
      rootfs_helia_provider_keepalive_seconds:
        description: Seconds to keep Helia online when rootfs_upload_driver is overridden to helia
        required: true
        default: '300'
        type: string
      tooling_ref:
        description: relay-button ref containing the shared tooling changes. Empty uses this workflow ref.
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish-rootfs:
    uses: ./.github/workflows/aleph-rootfs-build-publish-deploy.yml
    with:
      profile: ${{ inputs.profile }}
      publish: ${{ inputs.publish }}
      deploy_vm: ${{ inputs.deploy_vm }}
      confidential: ${{ inputs.confidential }}
      confidential_rootfs_item_hash: ${{ inputs.confidential_rootfs_item_hash }}
      vm_ssh_public_key: ${{ inputs.vm_ssh_public_key }}
      vm_vcpus: ${{ inputs.vm_vcpus }}
      vm_memory_mib: ${{ inputs.vm_memory_mib }}
      enable_caddy_proxy: ${{ inputs.enable_caddy_proxy }}
      rootfs_contract_path: ${{ inputs.rootfs_contract_path }}
      project_repository: ${{ inputs.project_repository }}
      project_ref: ${{ inputs.project_ref }}
      rootfs_upload_driver: aleph-ipfs
      rootfs_skip_build: ${{ inputs.rootfs_skip_build }}
      rootfs_helia_provider_keepalive_seconds: ${{ inputs.rootfs_helia_provider_keepalive_seconds }}
      tooling_repository: NiKrause/relay-button
      tooling_ref: ${{ inputs.tooling_ref || github.ref_name }}
    secrets: inherit

  summarize:
    runs-on: ubuntu-24.04
    needs:
      - publish-rootfs
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Aleph Rootfs IPFS Publish"
            echo
            echo "- result: ${{ needs.publish-rootfs.result }}"
            echo "- profile: ${{ inputs.profile }}"
            echo "- rootfs cid: ${{ needs.publish-rootfs.outputs.rootfs_cid }}"
            echo "- rootfs item hash: ${{ needs.publish-rootfs.outputs.rootfs_item_hash }}"
            echo "- rootfs artifact: ${{ needs.publish-rootfs.outputs.rootfs_artifact_url }}"
            echo "- manifest gateway: ${{ needs.publish-rootfs.outputs.rootfs_manifest_gateway_url }}"
            echo "- vm item hash: ${{ needs.publish-rootfs.outputs.vm_instance_item_hash }}"
            echo "- vm status: ${{ needs.publish-rootfs.outputs.vm_status }}"
          } >> "$GITHUB_STEP_SUMMARY"
