name: Aleph Confidential Smoke

# Starts one SEV-SNP instance from an encrypted rootfs with Aleph's own CLI,
# attests it, unlocks it, and forgets it again (#154). Run by hand: every run
# spends a few cents of credits from the account behind ALEPH_PRIVATE_KEY.
#
# image=busybox only proves the launch. image=debian-docker builds a Debian
# rootfs with sshd and Docker under a small foreground init (the measured init
# chroots into the rootfs, so systemd cannot be PID 1 there), logs in over SSH
# after the unlock and reports what the guest offers a workload.
# image=paperless does the same, then runs Paperless-ngx with Postgres and
# Valkey on the host network, reaches it through an SSH tunnel and checks that
# an uploaded image is OCR'd.

on:
  workflow_dispatch:
    inputs:
      crn:
        description: SEV-SNP node hash (or a unique prefix) to pin the instance to
        required: true
        default: 42c53b2d5adb42dc8bc848bdccdec951308fc9dfc6c250c7d2533dbaf75d058e
        type: string
      image:
        description: Rootfs to encrypt and boot
        required: false
        default: busybox
        type: choice
        options:
          - busybox
          - debian-docker
          - paperless
      size:
        description: Instance size slug
        required: false
        default: 1vcpu-2gb
        type: string
      keep_minutes:
        description: Minutes to keep the instance running after unlock before it is forgotten (0-30)
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: aleph-confidential-smoke
  cancel-in-progress: false

env:
  ALEPH_CLI_VERSION: v0.22.0
  # sha256 of aleph-cli-linux-x86_64 for ALEPH_CLI_VERSION, as the release lists it
  ALEPH_CLI_SHA256: 41b8ced717d9962683ce2d4409725774e826643be0bae1bfc623f6c0c7fb19d7

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
      CRN: ${{ inputs.crn }}
      SIZE: ${{ inputs.size }}
      IMAGE: ${{ inputs.image }}
      KEEP_MINUTES: ${{ inputs.keep_minutes }}
    steps:
      - name: Check inputs
        run: |
          [ -n "$ALEPH_PRIVATE_KEY" ] || { echo "::error::ALEPH_PRIVATE_KEY is not set"; exit 1; }
          [[ "$CRN" =~ ^[0-9a-f]{8,64}$ ]] || { echo "::error::crn must be a hex node hash or prefix"; exit 1; }
          [[ "$SIZE" =~ ^[0-9]+vcpu-[0-9]+gb$ ]] || { echo "::error::size must look like 1vcpu-2gb"; exit 1; }
          [[ "$KEEP_MINUTES" =~ ^[0-9]+$ ]] && [ "$KEEP_MINUTES" -le 30 ] || { echo "::error::keep_minutes must be 0-30"; exit 1; }

      - name: Install the aleph CLI
        run: |
          curl -fsSL -o /usr/local/bin/aleph \
            "https://github.com/aleph-im/aleph-rs/releases/download/${ALEPH_CLI_VERSION}/aleph-cli-linux-x86_64"
          echo "${ALEPH_CLI_SHA256}  /usr/local/bin/aleph" | sha256sum -c -
          chmod +x /usr/local/bin/aleph
          aleph --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static cryptsetup debootstrap e2fsprogs jq >/dev/null

      - name: Generate a passphrase and an SSH key for this run
        run: |
          pass="$(openssl rand -hex 32)"
          echo "::add-mask::$pass"
          printf '%s' "$pass" > "$RUNNER_TEMP/luks.pass"
          chmod 600 "$RUNNER_TEMP/luks.pass"
          ssh-keygen -q -t ed25519 -N '' -C relay-button-confidential-smoke -f "$RUNNER_TEMP/smoke_ed25519"

      - name: Build a minimal plain rootfs
        if: inputs.image == 'busybox'
        # busybox and an init that stays in the foreground: the measured init
        # chroots into the unlocked rootfs and execs /sbin/init.
        run: |
          root="$RUNNER_TEMP/rootfs"
          mkdir -p "$root"/{bin,sbin,proc,sys,dev,tmp,etc}
          cp /bin/busybox "$root/bin/busybox"
          for app in sh sleep mount echo cat date uname; do ln -s busybox "$root/bin/$app"; done
          cat > "$root/sbin/init" <<'EOF'
          #!/bin/sh
          mount -t proc proc /proc 2>/dev/null
          echo "relay-button confidential smoke: rootfs unlocked, $(uname -r)" > /dev/console
          while true; do sleep 3600; done
          EOF
          chmod +x "$root/sbin/init"
          truncate -s 64M "$RUNNER_TEMP/plain.ext4"
          mkfs.ext4 -q -d "$root" "$RUNNER_TEMP/plain.ext4"

      - name: Build a Debian rootfs with sshd and Docker
        if: inputs.image != 'busybox'
        # No systemd and no cloud-init in a confidential instance: /sbin/init
        # is a script that mounts what a workload needs, starts dockerd in
        # the background and keeps sshd in the foreground. The run's SSH key
        # is baked in, since the CRN cannot provision an encrypted rootfs.
        run: |
          root="$RUNNER_TEMP/rootfs"
          sudo debootstrap --variant=minbase \
            --include=openssh-server,docker.io,iproute2,iputils-ping,ca-certificates,curl,procps,kmod \
            bookworm "$root" http://deb.debian.org/debian >/dev/null
          sudo install -d -m 700 "$root/root/.ssh"
          sudo install -m 600 "$RUNNER_TEMP/smoke_ed25519.pub" "$root/root/.ssh/authorized_keys"
          sudo chroot "$root" ssh-keygen -A >/dev/null
          printf 'PermitRootLogin prohibit-password\nPasswordAuthentication no\nUseDNS no\n' | sudo tee "$root/etc/ssh/sshd_config.d/smoke.conf" >/dev/null
          echo rb-confidential-smoke | sudo tee "$root/etc/hostname" >/dev/null
          sudo touch "$root/etc/resolv.conf"
          sudo rm -f "$root/sbin/init"
          sudo tee "$root/sbin/init" >/dev/null <<'EOF'
          #!/bin/sh
          # Foreground init for a chrooted confidential rootfs: no systemd.
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          mkdir -p /run /dev/pts /sys/fs/cgroup /var/log
          mount -t tmpfs -o mode=755 tmpfs /run
          mkdir -p /run/sshd
          mount -t devpts -o gid=5,mode=620,ptmxmode=666 devpts /dev/pts 2>/dev/null
          mountpoint -q /sys/fs/cgroup || mount -t cgroup2 none /sys/fs/cgroup 2>/dev/null
          hostname -F /etc/hostname 2>/dev/null
          # The CRN grows the disk, not the filesystem inside the LUKS volume.
          # resize2fs does not see the chroot's root as mounted and refuses,
          # so ask the kernel to grow it online (EXT4_IOC_RESIZE_FS).
          bs=$(tune2fs -l /dev/mapper/cryptroot | sed -n 's/^Block size: *//p')
          blocks=$(( $(blockdev --getsize64 /dev/mapper/cryptroot) / bs ))
          perl -e 'sysopen(my $f, "/", 0) or die "open: $!"; ioctl($f, 0x40086610, pack("Q", $ARGV[0])) or die "EXT4_IOC_RESIZE_FS: $!\n"' "$blocks" \
            > /var/log/resize2fs.log 2>&1 && echo "grown to $blocks blocks of $bs" >> /var/log/resize2fs.log
          echo "smoke-init: $(uname -r), starting dockerd and sshd" > /dev/console
          # The measured runtime kernel has no nftables, bridge or overlayfs:
          # Docker runs without its own networking, on the vfs driver, and
          # containers use the host network.
          dockerd --iptables=false --ip6tables=false --bridge=none --storage-driver=vfs \
            > /var/log/dockerd.log 2>&1 &
          exec /usr/sbin/sshd -D -e
          EOF
          sudo chmod 755 "$root/sbin/init"
          # The CCN takes at most 1 GiB per upload (pyaleph
          # DEFAULT_MAX_UPLOAD_FILE_SIZE) and the CRN grows the filesystem to
          # the instance disk, so ship the image tight and pull containers later.
          sudo rm -rf "$root"/var/cache/apt/* "$root"/var/lib/apt/lists/* \
            "$root"/usr/share/doc/* "$root"/usr/share/man/* "$root"/usr/share/info/* \
            "$root"/usr/share/locale/*
          size_mib=$(( $(sudo du -sm "$root" | cut -f1) * 110 / 100 + 64 ))
          echo "rootfs content: $(sudo du -sh "$root" | cut -f1), image ${size_mib} MiB"
          [ "$size_mib" -le 900 ] || { echo "::error::the plain image (${size_mib} MiB) would exceed the 1 GiB upload limit once encrypted"; exit 1; }
          truncate -s "${size_mib}M" "$RUNNER_TEMP/plain.ext4"
          sudo mkfs.ext4 -q -b 4096 -T default -d "$root" "$RUNNER_TEMP/plain.ext4"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/plain.ext4"
          ls -lh "$RUNNER_TEMP/plain.ext4"

      - name: Create the confidential instance
        id: create
        run: |
          set -o pipefail
          aleph instance create "rb-confidential-smoke-${GITHUB_RUN_ID}" \
            --confidential \
            --encrypt-rootfs "$RUNNER_TEMP/plain.ext4" \
            --passphrase-file "$RUNNER_TEMP/luks.pass" \
            --size "$SIZE" \
            --crn "$CRN" \
            --ssh-pubkey-file "$RUNNER_TEMP/smoke_ed25519.pub" \
            --chain eth \
            --wait 600 2>&1 | tee "$RUNNER_TEMP/create.log" || status=$?
          hash="$(grep -oE 'Item hash: +[0-9a-f]{64}' "$RUNNER_TEMP/create.log" | grep -oE '[0-9a-f]{64}' | head -1 || true)"
          echo "item_hash=$hash" >> "$GITHUB_OUTPUT"
          store="$(grep -oE 'Uploaded encrypted rootfs: +[0-9a-f]{64}' "$RUNNER_TEMP/create.log" | grep -oE '[0-9a-f]{64}' | head -1 || true)"
          echo "rootfs_store=$store" >> "$GITHUB_OUTPUT"
          [ -n "$hash" ] || { echo "::error::no INSTANCE item hash in the CLI output"; exit 1; }
          exit "${status:-0}"

      - name: Wait for the node to start the instance
        id: execution
        env:
          ITEM_HASH: ${{ steps.create.outputs.item_hash }}
        run: |
          crn_url="$(curl -fsS 'https://api2.aleph.im/api/v0/aggregates/0xa1B3bb7d2332383D96b7796B908fB7f7F3c2Be10.json?keys=corechannel' \
            | jq -r --arg p "$CRN" '.data.corechannel.resource_nodes[] | select(.hash | startswith($p)) | .address' | head -1)"
          crn_url="${crn_url%/}"
          echo "crn_url=$crn_url" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            entry="$(curl -fsS --max-time 15 "$crn_url/v2/about/executions/list" | jq -c --arg h "$ITEM_HASH" '.[$h] // empty' || true)"
            [ -n "$entry" ] || entry='{}'
            state="$(jq -r '.state // "unknown"' <<<"$entry")"
            echo "[$i] $(jq -c '{state, running, awaiting_confidential_init, allocation}' <<<"$entry")"
            [ "$(jq -r '.running' <<<"$entry")" = true ] && break
            [ "$(jq -r '.awaiting_confidential_init' <<<"$entry")" = true ] && break
            sleep 10
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "host_ipv4=$(jq -r '.networking.host_ipv4 // empty' <<<"$entry")" >> "$GITHUB_OUTPUT"
          echo "ssh_port=$(jq -r '.networking.mapped_ports["22"].host // empty' <<<"$entry")" >> "$GITHUB_OUTPUT"
          echo "ipv6=$(jq -r '.networking.ipv6_ip // empty' <<<"$entry")" >> "$GITHUB_OUTPUT"

      - name: Attest
        id: attest
        env:
          ITEM_HASH: ${{ steps.create.outputs.item_hash }}
        run: |
          for i in 1 2 3 4 5 6; do
            if aleph instance attest "$ITEM_HASH" --crn "$CRN" --json > "$RUNNER_TEMP/attest.json" 2> "$RUNNER_TEMP/attest.err"; then
              jq . "$RUNNER_TEMP/attest.json"
              exit 0
            fi
            cat "$RUNNER_TEMP/attest.err"
            sleep 20
          done
          exit 1

      - name: Unlock
        env:
          ITEM_HASH: ${{ steps.create.outputs.item_hash }}
        run: |
          aleph instance unlock "$ITEM_HASH" --crn "$CRN" --passphrase-file "$RUNNER_TEMP/luks.pass" --chain eth

      - name: Check that it keeps running
        env:
          ITEM_HASH: ${{ steps.create.outputs.item_hash }}
          CRN_URL: ${{ steps.execution.outputs.crn_url }}
        run: |
          sleep 60
          entry="$(curl -fsS --max-time 15 "$CRN_URL/v2/about/executions/list" | jq -c --arg h "$ITEM_HASH" '.[$h] // empty')"
          jq '{state, running, awaiting_confidential_init, allocation}' <<<"$entry"
          [ "$(jq -r '.running' <<<"$entry")" = true ] || { echo "::error::the instance is not running a minute after unlock"; exit 1; }

      - name: Probe the guest over SSH
        id: probe
        if: inputs.image != 'busybox'
        env:
          ITEM_HASH: ${{ steps.create.outputs.item_hash }}
          CRN_URL: ${{ steps.execution.outputs.crn_url }}
        run: |
          # The node can report the instance running before its port mapping.
          for i in $(seq 1 18); do
            entry="$(curl -fsS --max-time 15 "$CRN_URL/v2/about/executions/list" | jq -c --arg h "$ITEM_HASH" '.[$h] // {}' || echo '{}')"
            HOST="$(jq -r '.networking.host_ipv4 // empty' <<<"$entry")"
            PORT="$(jq -r '.networking.mapped_ports["22"].host // empty' <<<"$entry")"
            [ -n "$HOST" ] && [ -n "$PORT" ] && break
            sleep 10
          done
          [ -n "$HOST" ] && [ -n "$PORT" ] || { echo "::error::no host address or mapped SSH port"; exit 1; }
          ssh_guest() {
            ssh -i "$RUNNER_TEMP/smoke_ed25519" -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "$@"
          }
          for i in $(seq 1 12); do ssh_guest true 2>/dev/null && break; sleep 10; done
          ssh_guest 'sh -s' > "$RUNNER_TEMP/probe.txt" 2>&1 <<'EOF' || true
          section() { echo; echo "### $1"; }
          section kernel; uname -a
          section network; ip -br addr; ip route; cat /etc/resolv.conf
          section "outbound"; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 https://example.com || echo "no outbound https"
          section "secrets dir"; ls -la /tmp/secrets 2>&1
          section "filesystems"; grep -E 'overlay|cgroup|ext4' /proc/filesystems
          section "cgroups"; cat /sys/fs/cgroup/cgroup.controllers 2>&1
          section "modules"; lsmod 2>&1 | head -40
          section "kernel features"; for f in overlay nf_tables bridge veth fuse; do printf '%s: ' "$f"; grep -qw "$f" /proc/filesystems /proc/modules 2>/dev/null && echo yes || { [ -d "/sys/module/$f" ] && echo builtin || echo no; }; done
          section "memory and disk"; free -m; lsblk 2>/dev/null; df -h /; cat /var/log/resize2fs.log
          section "docker info"; docker info 2>&1 | grep -E 'Server Version|Storage Driver|Cgroup|Kernel|ERROR|WARNING' || tail -20 /var/log/dockerd.log
          section "docker run (host network)"; docker run --rm --network host hello-world > /tmp/hello.txt 2>&1; grep -m1 -E "Hello from Docker|rror" /tmp/hello.txt
          section "docker run (host network, outbound)"; docker run --rm --network host busybox:1.36 wget -qO /tmp/x -T 10 http://example.com > /tmp/wget.txt 2>&1 && echo "outbound from a container: ok" || tail -3 /tmp/wget.txt
          section "dockerd log tail"; tail -15 /var/log/dockerd.log
          EOF
          cat "$RUNNER_TEMP/probe.txt"
          grep -q "Hello from Docker" "$RUNNER_TEMP/probe.txt" && echo "docker=ok" >> "$GITHUB_OUTPUT" || echo "docker=failed" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Run Paperless and OCR a test receipt
        id: paperless
        if: inputs.image == 'paperless'
        env:
          HOST: ${{ steps.probe.outputs.host }}
          PORT: ${{ steps.probe.outputs.port }}
          PAPERLESS_IMAGE: ghcr.io/paperless-ngx/paperless-ngx:3.2.1
          POSTGRES_IMAGE: docker.io/library/postgres:18
          VALKEY_IMAGE: docker.io/valkey/valkey:9-alpine
        # There is no guest firewall and the guest has a public IPv6 address,
        # so every service binds to 127.0.0.1 and Paperless is reached through
        # an SSH tunnel, never through a public port.
        run: |
          out="$RUNNER_TEMP/paperless.txt"
          log() { echo "$*" | tee -a "$out"; }
          ssh_guest() {
            ssh -i "$RUNNER_TEMP/smoke_ed25519" -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "$@"
          }
          for v in DBPASS ADMIN_PASS SECRET; do
            val="$(openssl rand -hex 24)"; echo "::add-mask::$val"; printf -v "$v" '%s' "$val"
          done

          t0=$(date +%s)
          ssh_guest "PAPERLESS_IMAGE=$PAPERLESS_IMAGE POSTGRES_IMAGE=$POSTGRES_IMAGE VALKEY_IMAGE=$VALKEY_IMAGE sh -s" <<'EOF' 2>&1 | tee -a "$out"
          set -e
          for img in "$VALKEY_IMAGE" "$POSTGRES_IMAGE" "$PAPERLESS_IMAGE"; do
            s=$(date +%s); docker pull -q "$img" >/dev/null; echo "pulled $img in $(( $(date +%s) - s ))s"
          done
          EOF
          t_pull=$(( $(date +%s) - t0 ))
          log "pull total: ${t_pull}s"

          t1=$(date +%s)
          ssh_guest "DBPASS=$DBPASS ADMIN_PASS=$ADMIN_PASS SECRET=$SECRET PAPERLESS_IMAGE=$PAPERLESS_IMAGE POSTGRES_IMAGE=$POSTGRES_IMAGE VALKEY_IMAGE=$VALKEY_IMAGE sh -s" <<'EOF' 2>&1 | tee -a "$out"
          set -e
          mkdir -p /srv/paperless/data /srv/paperless/media /srv/paperless/consume /srv/paperless/export /srv/paperless/pg
          docker run -d --name valkey --network host "$VALKEY_IMAGE" valkey-server --bind 127.0.0.1 --protected-mode yes >/dev/null
          docker run -d --name db --network host \
            -e POSTGRES_DB=paperless -e POSTGRES_USER=paperless -e POSTGRES_PASSWORD="$DBPASS" \
            -v /srv/paperless/pg:/var/lib/postgresql "$POSTGRES_IMAGE" -c listen_addresses=127.0.0.1 >/dev/null
          docker run -d --name paperless --network host \
            -e PAPERLESS_REDIS=redis://127.0.0.1:6379 -e PAPERLESS_DBHOST=127.0.0.1 -e PAPERLESS_DBPASS="$DBPASS" \
            -e PAPERLESS_SECRET_KEY="$SECRET" -e PAPERLESS_ADMIN_USER=admin -e PAPERLESS_ADMIN_PASSWORD="$ADMIN_PASS" \
            -e PAPERLESS_BIND_ADDR=127.0.0.1 -e PAPERLESS_PORT=8000 -e PAPERLESS_OCR_LANGUAGE=deu+eng \
            -e PAPERLESS_URL=http://127.0.0.1:18000 \
            -v /srv/paperless/data:/usr/src/paperless/data -v /srv/paperless/media:/usr/src/paperless/media \
            -v /srv/paperless/consume:/usr/src/paperless/consume -v /srv/paperless/export:/usr/src/paperless/export \
            "$PAPERLESS_IMAGE" >/dev/null
          echo "containers started"
          EOF

          ssh -i "$RUNNER_TEMP/smoke_ed25519" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -f -N -L 18000:127.0.0.1:8000 "root@$HOST"
          api=http://127.0.0.1:18000/api
          up=""
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$api/" || true)"
            if [ "$code" = 401 ] || [ "$code" = 200 ]; then up=1; break; fi
            sleep 10
          done
          t_up=$(( $(date +%s) - t1 ))
          if [ -z "$up" ]; then
            log "Paperless did not answer within 15 minutes"
            ssh_guest 'docker ps -a; docker logs --tail 40 paperless' 2>&1 | tee -a "$out"
            exit 1
          fi
          log "Paperless answering after ${t_up}s (migrations included)"

          token="$(curl -fsS --max-time 30 -d username=admin --data-urlencode "password=$ADMIN_PASS" "$api/token/" | jq -r .token)"
          echo "::add-mask::$token"
          auth=(-H "Authorization: Token $token" -H "Accept: application/json; version=9")

          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick >/dev/null
          convert -size 1400x520 xc:white -fill black -pointsize 52 \
            -annotate +60+120 'Wolkenfabrik Hosting GmbH' \
            -annotate +60+230 'Rechnung Nr. 2026-0001' \
            -annotate +60+340 'Betrag: 12,34 EUR' "$RUNNER_TEMP/receipt.png"

          t2=$(date +%s)
          task="$(curl -fsS --max-time 60 "${auth[@]}" -F "document=@$RUNNER_TEMP/receipt.png" -F title=confidential-smoke "$api/documents/post_document/" | tr -d '"')"
          doc=""
          for i in $(seq 1 60); do
            t="$(curl -fsS --max-time 15 "${auth[@]}" "$api/tasks/?task_id=$task" | jq -c '.[0] // {}')"
            status="$(jq -r '.status // "PENDING"' <<<"$t")"
            if [ "$status" = SUCCESS ]; then doc="$(jq -r '.related_document' <<<"$t")"; break; fi
            if [ "$status" = FAILURE ]; then log "consumption failed: $(jq -r '.result' <<<"$t")"; exit 1; fi
            sleep 5
          done
          [ -n "$doc" ] || { log "the document was not consumed within 5 minutes"; exit 1; }
          t_ocr=$(( $(date +%s) - t2 ))
          content="$(curl -fsS --max-time 15 "${auth[@]}" "$api/documents/$doc/" | jq -r .content)"
          log "document $doc consumed in ${t_ocr}s; OCR text:"
          log "$content"
          ssh_guest 'echo; echo "disk:"; df -h / | tail -1; echo "docker:"; docker system df; echo "memory:"; free -m | sed -n 2p; docker stats --no-stream --format "{{.Name}} {{.MemUsage}}"' 2>&1 | tee -a "$out"
          if grep -qi wolkenfabrik <<<"$content" && grep -q '12,34' <<<"$content"; then
            echo "ocr=ok" >> "$GITHUB_OUTPUT"
          else
            echo "ocr=mismatch" >> "$GITHUB_OUTPUT"; exit 1
          fi

      - name: Keep it running
        if: inputs.keep_minutes != '0'
        run: sleep $((KEEP_MINUTES * 60))

      - name: Forget the instance
        if: always() && steps.create.outputs.item_hash != ''
        env:
          ITEM_HASH: ${{ steps.create.outputs.item_hash }}
        run: |
          echo y | aleph instance delete "$ITEM_HASH" --reason "confidential smoke test ${GITHUB_RUN_ID}" --chain eth

      - name: Forget the encrypted rootfs
        # The STORE of the uploaded image outlives the instance and keeps
        # costing credits until it is forgotten.
        if: always() && steps.create.outputs.rootfs_store != ''
        env:
          ROOTFS_STORE: ${{ steps.create.outputs.rootfs_store }}
        run: |
          echo y | aleph message forget "$ROOTFS_STORE" --reason "confidential smoke test rootfs ${GITHUB_RUN_ID}" --chain eth

      - name: Summary
        if: always()
        env:
          ITEM_HASH: ${{ steps.create.outputs.item_hash }}
          STATE: ${{ steps.execution.outputs.state }}
          ATTEST: ${{ steps.attest.outcome }}
          DOCKER: ${{ steps.probe.outputs.docker }}
          OCR: ${{ steps.paperless.outputs.ocr }}
        run: |
          {
            echo "## Confidential smoke"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| CLI | \`${ALEPH_CLI_VERSION}\` |"
            echo "| Node | \`${CRN}\` |"
            echo "| Instance | \`${ITEM_HASH:-none}\` |"
            echo "| Execution state before attest | \`${STATE:-unknown}\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Attestation | ${ATTEST:-skipped} |"
            [ "$IMAGE" != busybox ] && echo "| Docker in the guest | ${DOCKER:-not probed} |"
            [ "$IMAGE" = paperless ] && echo "| Paperless OCR of a test receipt | ${OCR:-not reached} |"
            if [ -s "$RUNNER_TEMP/attest.json" ]; then
              echo
              echo '```json'
              cat "$RUNNER_TEMP/attest.json"
              echo '```'
            fi
            if [ -s "$RUNNER_TEMP/paperless.txt" ]; then
              echo
              echo "### Paperless"
              echo '```'
              cat "$RUNNER_TEMP/paperless.txt"
              echo '```'
            fi
            if [ -s "$RUNNER_TEMP/probe.txt" ]; then
              echo
              echo "### Guest probe"
              echo '```'
              cat "$RUNNER_TEMP/probe.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
