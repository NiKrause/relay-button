name: Release Packages

on:
  # A merged "Cut 0.9.x" is the act of releasing — it bumps every package and
  # writes the ROADMAP section the notes come from. Until now it published
  # nothing: somebody still had to dispatch this workflow and untick a
  # `dry_run` that defaults to true. Twice for 0.9.4 nobody did, and the miss
  # only surfaced a workflow later as a dist-tag promotion pointing at a
  # version npm had never seen.
  #
  # So a push to main publishes exactly when the root version changed, and
  # under `next` only. Promotion to `latest` stays a deliberate act: the
  # release notes have gated it on manual testing since 0.7.0, and that gate is
  # worth keeping.
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm pack instead of npm publish
        required: false
        default: true
        type: boolean
      npm_tag:
        description: npm dist-tag to publish under when dry_run is false
        required: false
        default: next
        type: string
      npm_scope:
        description: npm scope to publish under without the leading @
        required: false
        default: le-space
        type: string
      provenance:
        description: Enable npm provenance publishing (requires a public GitHub repository)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  # A cheap gate in front of the expensive job. Without it every merge to main
  # would install, test and build a release it was never going to publish.
  decide:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      reason: ${{ steps.decide.outputs.reason }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Two commits, so the step below can ask whether this push changed
          # the version. Nothing else here needs history.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Decide whether this run publishes
        id: decide
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # The dispatcher said so, either way.
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=dispatched as a dry run" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=dispatched with dry_run unchecked" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # A push publishes only when it changed the version. Every other
          # merge lands here and must do nothing at all.
          previous="$(git show 'HEAD^:package.json' 2>/dev/null | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo '')"
          if [[ "${previous}" == "${version}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=version unchanged at ${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # And never over an existing version: a revert-and-remerge would
          # otherwise fail halfway through the set, having published some.
          if npm view "@${{ inputs.npm_scope || 'le-space' }}/core@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=${version} is already on npm" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=version changed ${previous:-none} to ${version}" >> "$GITHUB_OUTPUT"


  release:
    needs: decide
    # A dispatch always runs, so a dry run stays available on demand. A push
    # runs only when it changed the version — that is the whole automation.
    if: ${{ needs.decide.outputs.publish == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run tests
        run: pnpm test

      - name: Build publishable artifacts
        env:
          NPM_SCOPE: ${{ inputs.npm_scope || 'le-space' }}
        run: pnpm publish:prepare

      - name: Pack dist packages
        if: needs.decide.outputs.publish != 'true'
        env:
          NPM_SCOPE: ${{ inputs.npm_scope || 'le-space' }}
        run: node ./scripts/publish-from-dist.mjs --dry-run --tag "${{ inputs.npm_tag || 'next' }}"

      - name: Upload dry-run tarballs
        if: needs.decide.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarballs
          path: |
            packages/shared-types/dist/*.tgz
            packages/core/dist/*.tgz
            packages/rootfs/dist/*.tgz
            packages/browser/dist/*.tgz
            packages/playwright/dist/*.tgz
            packages/ui/dist/*.tgz
            packages/node/dist/*.tgz

      - name: Verify npm token is configured
        if: needs.decide.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is required for publishing." >&2
            exit 1
          fi

      - name: Verify npm authentication
        if: needs.decide.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm whoami; then
            echo "npm authentication failed for the configured NPM_TOKEN." >&2
            echo "Refresh the token and confirm it has publish rights for the @${{ inputs.npm_scope || 'le-space' }} scope." >&2
            exit 1
          fi

      - name: Inspect npm scope access
        if: needs.decide.outputs.publish == 'true'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm access ls-packages --json >/tmp/npm-access.json 2>/tmp/npm-access.err; then
            echo "Could not inspect npm package access for the active account." >&2
            cat /tmp/npm-access.err >&2 || true
            echo "Continuing because some valid automation tokens cannot use npm access inspection APIs." >&2
            exit 0
          fi

          if ! node -e "const fs=require('node:fs'); const payload=JSON.parse(fs.readFileSync('/tmp/npm-access.json','utf8')); const names=Object.keys(payload || {}); const scope='@${{ inputs.npm_scope || 'le-space' }}/'; if(!names.some((name)=>name.startsWith(scope))){ console.error('The active npm account does not appear to have package access under ' + scope); process.exit(1) }"; then
            echo "The configured NPM_TOKEN does not appear to have package access under the @${{ inputs.npm_scope || 'le-space' }} scope." >&2
            echo "Continuing to the publish step because npm access inspection can under-report automation token capabilities." >&2
            exit 0
          fi

      - name: Publish dist packages
        if: needs.decide.outputs.publish == 'true'
        env:
          NPM_SCOPE: ${{ inputs.npm_scope || 'le-space' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          args=(--tag "${{ inputs.npm_tag || 'next' }}")
          if [[ "${{ inputs.provenance || false }}" == "true" ]]; then
            args+=(--provenance)
          fi
          node ./scripts/publish-from-dist.mjs "${args[@]}"

      # A green tick is not an answer to "did it publish?". `dry_run` defaults
      # to true, so the obvious click — Run workflow, leave everything alone —
      # packs and publishes nothing while the run goes green. That happened
      # twice for 0.9.4, and both times the failure only surfaced one workflow
      # later, as a bare `400 Bad Request` from a dist-tag promotion pointing
      # at a version npm had never seen. The summary now says which of the two
      # this run was, in the place somebody looks first.
      - name: Say what this run did
        if: always()
        env:
          PUBLISHED: ${{ needs.decide.outputs.publish }}
          REASON: ${{ needs.decide.outputs.reason }}
          NPM_TAG: ${{ inputs.npm_tag || 'next' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${PUBLISHED}" != "true" ]]; then
            {
              echo "## Nothing was published — ${REASON}"
              echo
              echo "npm still has whatever it had before."
              echo
              echo "To publish, run this workflow again with **dry_run unchecked**."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## Published \`${version}\` under the \`${NPM_TAG}\` tag"
              echo
              echo "\`latest\` does **not** move on its own: run **Promote npm dist-tag**"
              echo "with version \`${version}\` when this version is the one to recommend."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Without this the npm publish is the whole release: every version after
      # 0.7.0 shipped to npm with no tag and no GitHub release, and the roadmap
      # went on linking to release notes that did not exist. Runs only on a real
      # publish, and skips a tag that is already there so a re-run is harmless.
      - name: Tag the release and publish notes
        if: needs.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${tag} already released; leaving it alone."
            exit 0
          fi

          # Release notes come from the roadmap entry for this version, so the
          # release and the repo cannot tell different stories.
          notes_file="$(mktemp)"
          node -e "
            const fs = require('node:fs')
            const lines = fs.readFileSync('ROADMAP.md', 'utf8').split('\n')
            const version = process.argv[1]
            const heading = new RegExp('^## (Shipped: )?' + version.replace(/\./g, '\\.') + ' ')
            const start = lines.findIndex((line) => heading.test(line))
            if (start < 0) {
              console.error('No ROADMAP section for ' + version + '; add one before releasing.')
              process.exit(1)
            }
            let end = lines.findIndex((line, index) => index > start && line.startsWith('## '))
            if (end < 0) end = lines.length
            fs.writeFileSync(process.argv[2], lines.slice(start + 1, end).join('\n').trim() + '\n')
            fs.writeFileSync(process.argv[3], lines[start].replace(/^## (Shipped: )?/, ''))
          " "${version}" "${notes_file}" /tmp/release-title

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "$(cat /tmp/release-title)" \
            --notes-file "${notes_file}"
