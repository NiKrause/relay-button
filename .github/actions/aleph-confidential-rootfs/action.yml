name: Aleph Confidential Rootfs
description: >-
  Turn a relay profile image into a LUKS-encrypted confidential rootfs and publish it on Aleph:
  convert (packages/rootfs/reference/confidential), encrypt, add to IPFS, STORE. The result is the
  rootfs_item_hash for aleph-vm-deploy with confidential true.

inputs:
  source_store:
    description: Item hash of the STORE message of a published plain profile rootfs (qcow2 or raw). Either this or image_path.
    required: false
    default: ''
  image_path:
    description: Path to a profile image built in this job (qcow2 or raw). Either this or source_store.
    required: false
    default: ''
  ssh_public_key:
    description: SSH public key baked into the image as root's authorized_keys (an encrypted rootfs cannot be provisioned from outside)
    required: true
  luks_passphrase:
    description: LUKS passphrase for the encrypted rootfs; the same value goes to aleph-vm-deploy
    required: true
  aleph_private_key:
    description: Hex EVM private key that signs and pays (credits) for the STORE message
    required: true
  api_host:
    description: Aleph API host for the STORE message
    required: false
    default: https://api2.aleph.im
  ipfs_add_url:
    description: Ignored since Aleph's IPFS hosts take no uploads (2026-10-26); the image goes to the API node's /api/v0/ipfs/add_file
    required: false
    default: ""
  channel:
    description: Aleph channel for the STORE message
    required: false
    default: ALEPH-CLOUDSOLUTIONS

outputs:
  rootfs_item_hash:
    description: Item hash of the STORE message of the encrypted rootfs
    value: ${{ steps.publish.outputs.rootfs_item_hash }}
  rootfs_size_mib:
    description: Size of the encrypted rootfs in MiB
    value: ${{ steps.encrypt.outputs.size_mib }}

runs:
  using: composite
  steps:
    - name: Install image tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq cryptsetup e2fsprogs jq qemu-utils rsync >/dev/null

    - name: Get the profile image
      id: source
      shell: bash
      env:
        SOURCE_STORE: ${{ inputs.source_store }}
        IMAGE_PATH: ${{ inputs.image_path }}
        API_HOST: ${{ inputs.api_host }}
      run: |
        if [ -n "$IMAGE_PATH" ]; then
          echo "image=$IMAGE_PATH" >> "$GITHUB_OUTPUT"; exit 0
        fi
        [[ "$SOURCE_STORE" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::set image_path or a 64-hex source_store"; exit 1; }
        msg="$(curl -fsS "$API_HOST/api/v0/messages/$SOURCE_STORE")"
        file_hash="$(jq -r '(.message.content // .content).item_hash' <<<"$msg")"
        image="$RUNNER_TEMP/confidential-source.img"
        curl -fsSL --retry 3 -o "$image" "$API_HOST/api/v0/storage/raw/$file_hash" \
          || curl -fsSL --retry 3 -o "$image" "https://ipfs.aleph.im/ipfs/$file_hash"
        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: Convert to a confidential rootfs
      shell: bash
      env:
        IMAGE: ${{ steps.source.outputs.image }}
        SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
      run: |
        printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/confidential-authorized_keys"
        sudo MAX_PLAIN_MIB=3500 "${{ github.action_path }}/../../../packages/rootfs/reference/confidential/make-confidential-rootfs.sh" \
          "$IMAGE" "$RUNNER_TEMP/confidential-plain.ext4" "$RUNNER_TEMP/confidential-authorized_keys"

    - name: Encrypt
      id: encrypt
      shell: bash
      env:
        LUKS_PASSPHRASE: ${{ inputs.luks_passphrase }}
      # Same container as `aleph instance create --encrypt-rootfs` and aleph-vm's
      # examples/instance_confidential_snp/build_luks_rootfs.sh: whole-device
      # LUKS2, aes-xts-plain64 spelled out (the measured init rejects any other
      # cipher), ext4 inside.
      run: |
        plain="$RUNNER_TEMP/confidential-plain.ext4"
        luks="$RUNNER_TEMP/confidential-rootfs.luks"
        pass="$RUNNER_TEMP/confidential-luks.pass"
        # Without CR/LF, as the CLI reads a passphrase file when it unlocks, so a
        # secret set from a file with a trailing newline still matches.
        ( umask 077; printf '%s' "$LUKS_PASSPHRASE" | tr -d '\r\n' > "$pass" )
        size_mib=$(( $(sudo stat -c%s "$plain") / 1048576 + 64 ))
        truncate -s "${size_mib}M" "$luks"
        loop="$(sudo losetup --find --show "$luks")"
        sudo cryptsetup luksFormat --type luks2 --cipher aes-xts-plain64 --batch-mode "$loop" "$pass"
        sudo cryptsetup luksOpen --key-file "$pass" "$loop" rb-confidential-build
        sudo dd if="$plain" of=/dev/mapper/rb-confidential-build bs=4M conv=fsync status=none
        sudo e2fsck -fp /dev/mapper/rb-confidential-build || [ $? -lt 4 ]
        sudo resize2fs /dev/mapper/rb-confidential-build
        sudo cryptsetup luksClose rb-confidential-build
        sudo losetup -d "$loop"
        sudo rm -f "$plain" "$pass"
        sudo chown "$(id -u):$(id -g)" "$luks"
        echo "size_mib=$size_mib" >> "$GITHUB_OUTPUT"
        ls -lh "$luks"

    - name: Publish on Aleph
      id: publish
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.aleph_private_key }}
        ALEPH_API: ${{ inputs.api_host }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        # One signed upload to the API node (publish-store.mjs explains why).
        luks="$RUNNER_TEMP/confidential-rootfs.luks"
        dir="$RUNNER_TEMP/confidential-store"
        mkdir -p "$dir" && cd "$dir"
        npm init -y >/dev/null && npm install --silent ethers@6.13.4 ipfs-unixfs-importer@17.1.1 >/dev/null
        cp "${{ github.action_path }}/publish-store.mjs" .
        node publish-store.mjs "$luks" > store.json
        rm -f "$luks"
        store="$(jq -r .item_hash store.json)"
        echo "rootfs_item_hash=$store" >> "$GITHUB_OUTPUT"
        for i in $(seq 1 60); do
          status="$(curl -fsS "$ALEPH_API/api/v0/messages/$store" | jq -r .status || true)"
          echo "[$i] STORE $store: $status"
          [ "$status" = processed ] && exit 0
          [ "$status" = rejected ] && { echo "::error::the STORE was rejected"; exit 1; }
          sleep 20
        done
        echo "::error::the STORE was not processed within 20 minutes"; exit 1
